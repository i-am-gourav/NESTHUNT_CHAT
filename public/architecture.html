<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestHunt - High-Level Architecture Diagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff385c, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .diagram-container {
            width: 100%;
            max-width: 1400px;
            background: #0d1117;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            padding: 10px;
        }
        .diagram-container img, .diagram-container object {
            width: 100%;
            height: auto;
            display: block;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 16px;
        }
        .btn {
            background: #ff385c;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NestHunt System Architecture</h1>
        <p>Full-Stack Vacation Rental Platform with In-App Vector RAG &amp; Cloud Integrations</p>
    </div>

    <div class="diagram-container">
        <object data="/architecture_diagram.svg" type="image/svg+xml" style="width: 100%; height: auto;"></object>
    </div>

    <div class="actions">
        <a href="/architecture_diagram.svg" target="_blank" class="btn">View Raw Full-Res Vector Image</a>
        <a href="/listings" class="btn btn-secondary">&larr; Back to NestHunt</a>
    </div>
</body>
</html>
